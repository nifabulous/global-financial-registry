name: Loopkeeper PR Review (posting)

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: ["Global Registry Core"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open pull request number to review
        required: true
        type: number

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: write

jobs:
  review:
    # Global Registry Core also runs for pushes. Those workflow_run events have
    # no PR target and must not invoke a PR review.
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        (github.event.workflow_run.event == 'pull_request' &&
         github.event.workflow_run.pull_requests[0].number != null)
      }}
    uses: nifabulous/loopkeeper/.github/workflows/pr-review-posting.yml@f1e92ab216382a3a000d95d33da6362008b706c0
    with:
      consumer_repo: ${{ github.repository }}
      loopkeeper_repo: nifabulous/loopkeeper
      consumer_trusted_sha: ""
      loopkeeper_sha: f1e92ab216382a3a000d95d33da6362008b706c0
      ci_workflow_name: Global Registry Core
      ci_workflow_file: registry-core.yml
      expected_head_sha: ${{ github.event.workflow_run.head_sha || '' }}
      job_timeout_seconds: 1200
      post_comments: true
      pr_number: ${{ fromJSON(format('{0}', github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || inputs.pr_number || 0)) }}
      policy_path: .github/codex/review-policy.md
      contract_path: ""
      context_path: .github/codex/context-files.txt
    secrets:
      model_api_key: ${{ secrets.LOOPKEEPER_API_KEY }}
