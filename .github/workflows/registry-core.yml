name: Global Registry Core

on:
  push:
    paths:
      - "**"
      - ".github/workflows/registry-core.yml"
  pull_request:
    paths:
      - "**"
      - ".github/workflows/registry-core.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check src tests
      - run: python -m pytest --cov=financial_registry --cov-fail-under=85 -q
      - run: node --test web/gallery-core.test.mjs
      - run: node --test web/theme.test.mjs
      - run: node --test web/theme-ui.test.mjs
      - run: python scripts/check_logo_manifest.py data/registry-with-logos.json data/logo-manifest.json
      - run: python scripts/build_gallery_data.py data/registry-with-logos.json data/gallery.json
